name: banigoba
description: "AI-powered virtual wardrobe, fashion and social app"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  supabase_flutter: ^2.8.0
  firebase_core: ^3.0.0
  google_sign_in: ^6.2.1
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  image_picker: ^1.0.7
  http: ^1.1.0
  shared_preferences: ^2.2.2
  firebase_messaging: ^15.2.10
  url_launcher: ^6.3.1
  cached_network_image: ^4.0.2
  audioplayers: ^6.8.1
  share_plus: ^13.3.1
  crypto: ^3.0.7
  photo_manager: ^3.12.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/branding/splash_logo.png
    - assets/branding/g_mark.png
    - assets/sounds/

  # Plus Jakarta Sans, the typeface in the Figma designs (SIL OFL, see
  # assets/fonts/OFL.txt).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
