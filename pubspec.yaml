name: banigoba
description: "AI-powered virtual wardrobe, fashion and social app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  cloud_functions: ^5.0.0
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^6.0.4
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  image_picker: ^1.0.7
  firebase_storage: ^12.0.0
  http: ^1.1.0
  shared_preferences: ^2.2.2
  firebase_messaging: ^15.2.10
  url_launcher: ^6.3.1
  cached_network_image: ^4.0.2
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/branding/splash_logo.png
    - assets/sounds/