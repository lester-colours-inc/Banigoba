name: banigoba
description: "AI-powered virtual wardrobe, fashion and social app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_ui_auth: ^1.14.0
  firebase_ui_oauth_google: ^1.4.0
  firebase_ui_oauth_facebook: ^1.3.0
  firebase_ui_oauth_apple: ^1.2.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  crypto: ^3.0.6
  #flutter_facebook_auth: ^7.1.1
  ar_flutter_plugin_plus: ^1.1.3
  camera: ^0.10.6
  google_mlkit_face_detection: ^0.13.2
  google_mlkit_pose_detection: ^0.14.1
  google_mlkit_selfie_segmentation: ^0.10.1
  google_mlkit_commons: ^0.11.0
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  image_picker: ^1.0.7
  firebase_storage: ^12.0.0
  http: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_facebook_auth: ^6.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
