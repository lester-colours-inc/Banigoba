# Builds the same release APK we build locally:
#   flutter build apk --release --dart-define-from-file=dart_defines.json
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   GEMINI_API_KEY                      – written into dart_defines.json
#   ANDROID_DEBUG_KEYSTORE_BASE64       – base64 of ~/.android/debug.keystore.
#     build.gradle.kts signs release with the debug key, so CI must use the
#     same keystore or its APK won't install over locally built ones.

name: Android release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      - name: Write dart_defines.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for key in GEMINI_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "::warning::$key secret is not set; AI features will be disabled in this APK."
            fi
          done
          jq -n '{GEMINI_API_KEY: env.GEMINI_API_KEY}' > dart_defines.json

      - name: Restore signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set; APK is signed with a throwaway key and won't install over local builds."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=dart_defines.json

      - name: Name APK
        id: apk
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          name="banigoba-${version}-${GITHUB_SHA::7}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"
          echo "name=${name%.apk}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
